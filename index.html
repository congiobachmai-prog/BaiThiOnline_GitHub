<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaiLieuHub - Luyện Thi Online</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col font-sans">

    <!-- Header / Navbar -->
    <header class="bg-white shadow-sm border-b px-6 py-4 sticky top-0 z-40">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="showHome()">
                <span class="text-2xl font-black text-blue-600 tracking-tight">TaiLieuHub</span>
                <span class="text-gray-300">|</span>
                <span class="text-gray-600 text-sm font-medium">Luyện Thi TOEIC</span>
            </div>
            <div>
                <button id="btnBack" onclick="showHome()" class="text-sm font-semibold text-gray-600 hover:text-blue-600">
                    <i class="fa-solid fa-house mr-1"></i> Trang chủ
                </button>
            </div>
        </div>
    </header>

    <!-- TRANG CHỦ: DANH SÁCH BÀI THI PHÂN THEO PART -->
    <main id="homeView" class="max-w-5xl mx-auto w-full px-4 py-10 flex-grow">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-extrabold text-gray-900 mb-2">Danh Sách Đề Thi TOEIC Listening</h1>
            <p class="text-gray-500 text-sm">Chọn đề thi theo từng Part để bắt đầu luyện tập</p>
        </div>

        <!-- Loader khi tải danh sách bài thi -->
        <div id="listLoader" class="text-center py-10">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-blue-600 border-t-transparent"></div>
            <p class="mt-3 text-gray-500 text-sm font-medium">Đang lấy danh sách đề thi từ Supabase...</p>
        </div>

        <!-- Khung chứa danh sách các đề thi được gom nhóm -->
        <div id="examsListContainer"></div>
    </main>

    <!-- TRANG LÀM BÀI THI -->
    <main id="examView" class="max-w-3xl mx-auto w-full px-4 py-8 flex-grow hidden">
        <button onclick="showHome()" class="mb-4 text-sm font-semibold text-gray-600 hover:text-blue-600 flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Quay lại danh mục
        </button>

        <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-200 mb-6 text-center">
            <h1 id="examTitle" class="text-2xl font-bold text-gray-800">Bài Thi Online</h1>
            <p id="examSubTitle" class="text-xs text-gray-400 mt-1"></p>
            <div id="scoreBox" class="mt-3 text-lg font-bold text-blue-600 hidden"></div>
        </div>

        <!-- Loader khi tải câu hỏi -->
        <div id="examLoader" class="text-center py-10 hidden">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-blue-600 border-t-transparent"></div>
            <p class="mt-3 text-gray-500 text-sm font-medium">Đang tải câu hỏi bài thi...</p>
        </div>

        <div id="questionsContainer" class="space-y-6"></div>

        <div class="mt-8 text-center">
            <button id="submitBtn" onclick="submitExam()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-8 py-3.5 rounded-xl shadow-lg transition-all hidden">
                <i class="fa-solid fa-paper-plane mr-2"></i> Nộp Bài & Xem Đáp Án
            </button>
        </div>
    </main>

    <script>
        // Cấu hình Supabase với đúng API Key từ project của bạn
        const SUPABASE_URL = "https://wsbbdegvrcoffpkswhtq.supabase.co";
        const SUPABASE_KEY = "sb_publishable_d5rvYcP0DRHcEK-VHKCItQ_CVaM7TnC";
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentQuestionsData = [];

        // Tự động tải bài thi khi mở web
        window.addEventListener('DOMContentLoaded', fetchAllExams);

        // 1. Tải toàn bộ mã đề từ Supabase
        async function fetchAllExams() {
            document.getElementById('listLoader').classList.remove('hidden');
            document.getElementById('examsListContainer').innerHTML = '';

            try {
                const { data, error } = await _supabase
                    .from('exam_questions')
                    .select('course_code, exam_id')
                    .order('exam_id', { ascending: true });

                if (error || !data || data.length === 0) {
                    document.getElementById('examsListContainer').innerHTML = `
                        <p class="text-center text-red-500 col-span-full py-10">Không thể lấy dữ liệu đề thi từ Supabase!</p>
                    `;
                    return;
                }

                // Lọc danh sách exam_id duy nhất
                const uniqueExams = [];
                const map = new Map();
                for (const item of data) {
                    if(!map.has(item.exam_id)){
                        map.set(item.exam_id, true);
                        uniqueExams.push(item);
                    }
                }

                renderExamsGrouped(uniqueExams);
            } catch (err) {
                console.error('Lỗi khi tải đề thi:', err);
            } finally {
                document.getElementById('listLoader').classList.add('hidden');
            }
        }

        // 2. Hiển thị bài thi theo từng Part gọn gàng
        function renderExamsGrouped(exams) {
            const groups = {
                'Part 1: Mô tả tranh (10 câu)': exams.filter(e => e.exam_id.startsWith('PART1')),
                'Part 2: Hỏi & Đáp (30 câu)': exams.filter(e => e.exam_id.startsWith('PART2')),
                'Part 3: Hội thoại ngắn (30 câu)': exams.filter(e => e.exam_id.startsWith('PART3')),
                'Part 4: Bài nói ngắn (30 câu)': exams.filter(e => e.exam_id.startsWith('PART4'))
            };

            let html = '';

            for (const [partTitle, examList] of Object.entries(groups)) {
                if (examList.length === 0) continue;

                // Sắp xếp đề thi theo thứ tự TEST_01 -> TEST_10
                examList.sort((a, b) => a.exam_id.localeCompare(b.exam_id, undefined, {numeric: true}));

                html += `
                    <div class="mb-10">
                        <div class="flex items-center gap-3 mb-6 pb-2 border-b-2 border-blue-500">
                            <h2 class="text-xl font-bold text-gray-800">${partTitle}</h2>
                            <span class="bg-blue-100 text-blue-700 text-xs font-semibold px-2.5 py-0.5 rounded-full">
                                ${examList.length} đề thi
                            </span>
                        </div>

                        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${examList.map(item => {
                                const match = item.exam_id.match(/PART(\d+)_TEST_(\d+)/i);
                                const partNum = match ? match[1] : '';
                                const testNum = match ? match[2] : '';
                                const displayName = partNum ? `TOEIC Part ${partNum} - Đề ${testNum}` : item.exam_id;

                                return `
                                    <div onclick="openExam('${item.course_code}', '${item.exam_id}', '${displayName}')" 
                                         class="bg-white rounded-2xl p-6 shadow-sm hover:shadow-md border border-gray-200 cursor-pointer transition-all hover:border-blue-500 flex flex-col justify-between">
                                        <div>
                                            <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center text-xl mb-4">
                                                <i class="fa-solid fa-headphones"></i>
                                            </div>
                                            <h3 class="text-lg font-bold text-gray-800 mb-1">${displayName}</h3>
                                            <p class="text-gray-400 text-xs mb-4">Mã bài thi: ${item.exam_id}</p>
                                        </div>
                                        <span class="text-blue-600 font-bold text-xs">Vào làm bài &rarr;</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }

            document.getElementById('examsListContainer').innerHTML = html;
        }

        // 3. Chuyển về trang chủ
        function showHome() {
            document.getElementById('homeView').classList.remove('hidden');
            document.getElementById('examView').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 4. Mở đề thi và tải danh sách câu hỏi
        async function openExam(courseCode, examId, displayName) {
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('examView').classList.remove('hidden');
            document.getElementById('scoreBox').classList.add('hidden');
            document.getElementById('submitBtn').classList.add('hidden');
            
            document.getElementById('examTitle').innerText = displayName || `Bài Thi: ${examId}`;
            document.getElementById('examSubTitle').innerText = `Mã hệ thống: ${examId}`;
            document.getElementById('examLoader').classList.remove('hidden');
            document.getElementById('questionsContainer').innerHTML = '';

            const { data: questions, error } = await _supabase
                .from('exam_questions')
                .select('*')
                .eq('course_code', courseCode)
                .eq('exam_id', examId)
                .order('question_num', { ascending: true });

            document.getElementById('examLoader').classList.add('hidden');

            if (error || !questions || questions.length === 0) {
                document.getElementById('questionsContainer').innerHTML = `
                    <p class="text-center text-red-500 py-10">Chưa tìm thấy dữ liệu câu hỏi cho bài thi này!</p>
                `;
                return;
            }

            document.getElementById('submitBtn').classList.remove('hidden');
            currentQuestionsData = questions;
            renderQuestions(questions);
        }

        // 5. Render câu hỏi chuẩn TOEIC
        function renderQuestions(questions) {
            let html = '';
            let lastAudioUrl = '';

            questions.forEach((q) => {
                let opts = typeof q.options === 'string' ? JSON.parse(q.options) : q.options;
                
                const isPart1 = q.question_num >= 1 && q.question_num <= 10;
                const isPart2 = q.question_num >= 11 && q.question_num <= 40;
                const isPart3 = q.question_num >= 41 && q.question_num <= 70;
                const isPart4 = q.question_num >= 71 && q.question_num <= 100;

                // Kiểm tra audio mới để hiển thị thanh phát nhạc không bị lặp
                const showAudio = q.audio_url && q.audio_url !== lastAudioUrl;
                if (showAudio) {
                    lastAudioUrl = q.audio_url;
                }

                const gridCols = opts.length === 3 ? 'grid-cols-3' : 'grid-cols-4';

                html += `
                    ${showAudio ? `
                        <div class="sticky top-16 z-10 bg-blue-50 border border-blue-200 rounded-2xl p-4 shadow-md backdrop-blur-md bg-opacity-95 mb-6">
                            <div class="flex items-center justify-between mb-2">
                                <span class="font-bold text-blue-900 text-sm flex items-center gap-2">
                                    <i class="fa-solid fa-volume-high"></i> File Audio bài nghe ${isPart3 ? '(Cụm câu hỏi)' : ''}
                                </span>
                            </div>
                            <audio controls class="w-full rounded-lg">
                                <source src="${q.audio_url}" type="audio/mpeg">
                            </audio>
                        </div>
                    ` : ''}

                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-200">
                        <div class="font-bold text-gray-800 mb-3 flex items-center justify-between">
                            <span>Câu ${q.question_num}</span>
                            <span class="text-xs px-3 py-1 bg-gray-100 text-gray-500 rounded-full font-medium">
                                ${isPart1 ? 'Part 1: Hình ảnh' : isPart2 ? 'Part 2: Hỏi & Đáp' : isPart3 ? 'Part 3: Hội thoại' : 'Part 4: Bài nói'}
                            </span>
                        </div>

                        ${isPart2 ? `
                            <div class="text-gray-500 italic text-sm mb-4 bg-gray-50 p-3 rounded-xl border text-center">
                                Mark your answer on your answer sheet (Nghe câu hỏi và chọn đáp án A, B hoặc C)
                            </div>
                        ` : ''}

                        ${q.image_url ? `
                            <div class="mb-4 text-center">
                                <img src="${q.image_url}" class="max-w-full rounded-xl border mx-auto shadow-sm" alt="Câu ${q.question_num}">
                            </div>
                        ` : ''}

                        <div class="grid ${gridCols} gap-3 max-w-md mx-auto mb-4">
                            ${opts.map((opt) => {
                                const key = opt.trim().charAt(0) === '(' ? opt.trim().charAt(1) : opt.trim().charAt(0);
                                return `
                                    <label id="label_${q.question_num}_${key}" class="flex items-center justify-center p-3 border rounded-xl cursor-pointer hover:bg-blue-50 border-gray-200 font-bold text-gray-700 transition-all">
                                        <input type="radio" name="q_${q.question_num}" value="${key}" class="mr-2 text-blue-600">
                                        <span>${opt}</span>
                                    </label>
                                `;
                            }).join('')}
                        </div>

                        <div id="exp_${q.question_num}" class="mt-4 p-4 rounded-xl hidden text-sm">
                            <p class="font-bold mb-2 text-blue-700">Đáp án & Giải thích:</p>
                            ${q.explanation ? `<img src="${q.explanation}" class="max-w-full rounded-lg border mx-auto" alt="Giải thích câu ${q.question_num}">` : ''}
                        </div>
                    </div>
                `;
            });

            document.getElementById('questionsContainer').innerHTML = html;
        }

        // 6. Chức năng Nộp bài
        function submitExam() {
            let correctCount = 0;
            currentQuestionsData.forEach((q) => {
                const selected = document.querySelector(`input[name="q_${q.question_num}"]:checked`);
                const userChoice = selected ? selected.value : null;
                const correct = q.correct_option ? q.correct_option.trim().toUpperCase() : 'A';
                const expDiv = document.getElementById(`exp_${q.question_num}`);

                expDiv.classList.remove('hidden');
                
                let opts = typeof q.options === 'string' ? JSON.parse(q.options) : q.options;
                opts.forEach((opt) => {
                    const key = opt.trim().charAt(0) === '(' ? opt.trim().charAt(1) : opt.trim().charAt(0);
                    const label = document.getElementById(`label_${q.question_num}_${key}`);
                    if (label) {
                        label.classList.remove('bg-blue-50', 'border-blue-500', 'bg-emerald-100', 'border-emerald-500', 'bg-red-100', 'border-red-500');
                        if (key === correct) {
                            label.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800');
                        }
                    }
                });

                if (userChoice === correct) {
                    correctCount++;
                    expDiv.className = "mt-4 p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800";
                } else {
                    expDiv.className = "mt-4 p-4 rounded-xl bg-red-50 border border-red-200 text-red-800";
                    if (userChoice) {
                        const wrongLabel = document.getElementById(`label_${q.question_num}_${userChoice}`);
                        if (wrongLabel) {
                            wrongLabel.classList.add('bg-red-100', 'border-red-500', 'text-red-800');
                        }
                    }
                }
            });

            document.getElementById('scoreBox').innerText = `Kết quả của bạn: ${correctCount} / ${currentQuestionsData.length} câu đúng!`;
            document.getElementById('scoreBox').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
