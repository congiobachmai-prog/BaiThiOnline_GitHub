<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaiLieuHub - Luyện Thi TOEIC Online</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">

    <!-- Thanh Navigation Bar -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="showExamList()">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold text-xl">
                    T
                </div>
                <div>
                    <h1 class="font-bold text-lg text-gray-900 leading-tight">TaiLieuHub</h1>
                    <p class="text-xs text-gray-500">Luyện Thi TOEIC Listening</p>
                </div>
            </div>
            <button id="btnBack" onclick="showExamList()" class="hidden px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-semibold rounded-xl transition-all">
                ← Quay lại danh sách đề
            </button>
        </div>
    </nav>

    <!-- Content Container -->
    <main class="max-w-5xl mx-auto px-4 py-8">
        
        <!-- TRANG 1: DANH SÁCH ĐỀ THI GOM NHÓM THEO PART -->
        <div id="viewExamList">
            <div class="mb-8">
                <h2 class="text-3xl font-extrabold text-gray-900 mb-2">Danh sách Đề Thi Listening</h2>
                <p class="text-gray-600">Chọn đề thi theo từng Part để bắt đầu luyện tập</p>
            </div>

            <!-- Loader khi tải danh sách bài thi -->
            <div id="listLoader" class="text-center py-12">
                <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-blue-600 border-t-transparent"></div>
                <p class="mt-3 text-gray-500 font-medium">Đang tải danh sách bài thi...</p>
            </div>

            <!-- Container danh sách đề -->
            <div id="examsContainer"></div>
        </div>

        <!-- TRANG 2: GIAO DIỆN LÀM BÀI THI -->
        <div id="viewExamDetail" class="hidden">
            <!-- Header bài thi -->
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-200 mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h2 id="currentExamTitle" class="text-2xl font-bold text-gray-900">...</h2>
                    <p id="currentExamSub" class="text-sm text-gray-500">Mã bài thi: <span id="currentExamId"></span></p>
                </div>
                <button onclick="submitExam()" class="px-6 py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl shadow-sm transition-all text-sm">
                    ✓ Nộp bài & Xem đáp án
                </button>
            </div>

            <!-- Loader khi tải câu hỏi -->
            <div id="examLoader" class="text-center py-12 hidden">
                <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-blue-600 border-t-transparent"></div>
                <p class="mt-3 text-gray-500 font-medium">Đang nội dung đề thi...</p>
            </div>

            <!-- Container câu hỏi -->
            <div id="questionsContainer"></div>
        </div>

    </main>

    <script>
        // 1. Cấu hình Supabase
        const SUPABASE_URL = 'https://wsbbdegvrcoffpkswhtq.supabase.co';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY'; // Nhập Anon Key của bạn vào đây nếu cần
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentQuestionsData = [];

        // 2. Khởi tạo ứng dụng khi load trang
        document.addEventListener('DOMContentLoaded', () => {
            loadExams();
        });

        // 3. Tải danh sách bài thi từ Supabase
        async function loadExams() {
            document.getElementById('listLoader').classList.remove('hidden');
            document.getElementById('examsContainer').innerHTML = '';

            try {
                // Lấy danh sách các exam_id duy nhất
                const { data, error } = await _supabase
                    .from('exam_questions')
                    .select('exam_id')
                    .order('exam_id', { ascending: true });

                if (error) throw error;

                // Lọc bỏ các exam_id trùng lặp
                const uniqueExams = [...new Set(data.map(item => item.exam_id))].map(id => ({ exam_id: id }));
                
                renderExamsGrouped(uniqueExams);
            } catch (err) {
                console.error('Lỗi tải bài thi:', err);
                document.getElementById('examsContainer').innerHTML = `
                    <div class="bg-red-50 text-red-600 p-4 rounded-xl border border-red-200">
                        Không thể tải danh sách bài thi. Vui lòng kiểm tra kết quả kết nối Supabase.
                    </div>
                `;
            } finally {
                document.getElementById('listLoader').classList.add('hidden');
            }
        }

        // 4. Hiển thị danh sách bài thi gom nhóm chuẩn Part
        function renderExamsGrouped(exams) {
            const groups = {
                'Part 1: Mô tả tranh (10 câu)': exams.filter(e => e.exam_id.startsWith('PART1')),
                'Part 2: Hỏi & Đáp (30 câu)': exams.filter(e => e.exam_id.startsWith('PART2')),
                'Part 3: Hội thoại ngắn (30 câu)': exams.filter(e => e.exam_id.startsWith('PART3')),
                'Part 4: Bài nói ngắn (30 câu)': exams.filter(e => e.exam_id.startsWith('PART4'))
            };

            let html = '';

            for (const [partTitle, examList] of Object.entries(groups)) {
                if (examList.length === 0) continue;

                // Sắp xếp đề TEST_01 -> TEST_10
                examList.sort((a, b) => a.exam_id.localeCompare(b.exam_id, undefined, {numeric: true}));

                html += `
                    <div class="mb-10">
                        <div class="flex items-center gap-3 mb-6 pb-2 border-b-2 border-blue-500">
                            <h3 class="text-xl font-bold text-gray-800">${partTitle}</h3>
                            <span class="bg-blue-100 text-blue-700 text-xs font-semibold px-2.5 py-0.5 rounded-full">
                                ${examList.length} đề thi
                            </span>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${examList.map(e => {
                                const match = e.exam_id.match(/PART(\d+)_TEST_(\d+)/i);
                                const partNum = match ? match[1] : '';
                                const testNum = match ? match[2] : '';
                                const displayName = partNum ? `TOEIC Part ${partNum} - Đề ${testNum}` : e.exam_id;

                                return `
                                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-200 hover:shadow-md transition-all flex flex-col justify-between">
                                        <div>
                                            <div class="w-12 h-12 bg-blue-50 rounded-xl flex items-center justify-center mb-4 text-blue-600 text-xl">
                                                🎧
                                            </div>
                                            <h4 class="font-bold text-lg text-gray-900 mb-1">${displayName}</h4>
                                            <p class="text-xs text-gray-400 mb-4">Mã hệ thống: ${e.exam_id}</p>
                                        </div>
                                        
                                        <button onclick="selectExam('${e.exam_id}', '${displayName}')" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition-colors text-sm">
                                            Vào làm bài ➔
                                        </button>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }

            document.getElementById('examsContainer').innerHTML = html;
        }

        // 5. Chọn bài thi và tải câu hỏi
        async function selectExam(examId, displayName) {
            document.getElementById('viewExamList').classList.add('hidden');
            document.getElementById('viewExamDetail').classList.remove('hidden');
            document.getElementById('btnBack').classList.remove('hidden');
            
            document.getElementById('currentExamTitle').innerText = displayName || examId;
            document.getElementById('currentExamId').innerText = examId;
            document.getElementById('examLoader').classList.remove('hidden');
            document.getElementById('questionsContainer').innerHTML = '';

            try {
                const { data, error } = await _supabase
                    .from('exam_questions')
                    .select('*')
                    .eq('exam_id', examId)
                    .order('question_num', { ascending: true });

                if (error) throw error;

                currentQuestionsData = data;
                renderQuestions(data);
            } catch (err) {
                console.error('Lỗi tải câu hỏi:', err);
                document.getElementById('questionsContainer').innerHTML = `
                    <div class="bg-red-50 text-red-600 p-4 rounded-xl border border-red-200">
                        Không thể tải nội dung câu hỏi bài thi này.
                    </div>
                `;
            } finally {
                document.getElementById('examLoader').classList.add('hidden');
            }
        }

        // 6. Hiển thị danh sách câu hỏi chuẩn TOEIC
        function renderQuestions(questions) {
            let html = '';
            let lastAudioUrl = '';

            questions.forEach((q) => {
                let opts = typeof q.options === 'string' ? JSON.parse(q.options) : q.options;
                
                const isPart1 = q.question_num >= 1 && q.question_num <= 10;
                const isPart2 = q.question_num >= 11 && q.question_num <= 40;
                const isPart3 = q.question_num >= 41 && q.question_num <= 70;
                const isPart4 = q.question_num >= 71 && q.question_num <= 100;

                // Kiểm tra audio mới để ghim khung phát thanh (tránh lặp lại)
                const showAudio = q.audio_url && q.audio_url !== lastAudioUrl;
                if (showAudio) {
                    lastAudioUrl = q.audio_url;
                }

                const gridCols = opts.length === 3 ? 'grid-cols-3' : 'grid-cols-4';

                html += `
                    ${showAudio ? `
                        <div class="sticky top-16 z-10 bg-blue-50 border border-blue-200 rounded-2xl p-4 mb-6 shadow-md backdrop-blur-md bg-opacity-95">
                            <div class="flex items-center justify-between mb-2">
                                <span class="font-bold text-blue-900 text-sm flex items-center gap-2">
                                    🎧 File Audio bài nghe ${isPart3 ? '(Cụm câu hỏi)' : ''}
                                </span>
                            </div>
                            <audio controls class="w-full rounded-lg">
                                <source src="${q.audio_url}" type="audio/mpeg">
                            </audio>
                        </div>
                    ` : ''}

                    <div class="bg-white rounded-2xl p-6 mb-6 shadow-sm border border-gray-200">
                        <div class="font-bold text-gray-900 text-lg mb-3 flex items-center justify-between">
                            <span>Câu ${q.question_num}</span>
                            <span class="text-xs px-3 py-1 bg-gray-100 text-gray-600 rounded-full font-medium">
                                ${isPart1 ? 'Part 1: Hình ảnh' : isPart2 ? 'Part 2: Hỏi & Đáp' : isPart3 ? 'Part 3: Hội thoại' : 'Part 4: Bài nói'}
                            </span>
                        </div>

                        ${isPart2 ? `
                            <div class="text-gray-500 italic text-sm mb-4 bg-gray-50 p-3 rounded-xl border text-center">
                                Mark your answer on your answer sheet (Nghe câu hỏi và chọn đáp án A, B hoặc C)
                            </div>
                        ` : ''}

                        ${q.image_url ? `
                            <div class="mb-4 text-center">
                                <img src="${q.image_url}" class="max-w-full rounded-xl border mx-auto shadow-sm" alt="Câu ${q.question_num}">
                            </div>
                        ` : ''}

                        <div class="grid ${gridCols} gap-3 max-w-md mx-auto mb-4">
                            ${opts.map((opt) => {
                                const key = opt.trim().replace(/[\(\)]/g, '').charAt(0);
                                return `
                                    <label id="label_${q.question_num}_${key}" class="flex items-center justify-center p-3 border rounded-xl cursor-pointer hover:bg-blue-50 hover:border-blue-500 border-gray-200 font-bold text-gray-700 transition-all">
                                        <input type="radio" name="q_${q.question_num}" value="${key}" class="mr-2 text-blue-600">
                                        <span>${opt}</span>
                                    </label>
                                `;
                            }).join('')}
                        </div>

                        <div id="exp_${q.question_num}" class="mt-4 p-4 rounded-xl hidden text-sm bg-gray-50 border border-gray-200">
                            <p class="font-bold mb-2 text-blue-600">Đáp án & Giải thích:</p>
                            ${q.explanation ? `<img src="${q.explanation}" class="max-w-full rounded-lg border mx-auto" alt="Giải thích câu ${q.question_num}">` : ''}
                        </div>
                    </div>
                `;
            });

            document.getElementById('questionsContainer').innerHTML = html;
        }

        // 7. Chức năng Nộp bài & Chấm điểm
        function submitExam() {
            let correctCount = 0;
            let total = currentQuestionsData.length;

            currentQuestionsData.forEach((q) => {
                const selected = document.querySelector(`input[name="q_${q.question_num}"]:checked`);
                const expBox = document.getElementById(`exp_${q.question_num}`);
                
                if (expBox) expBox.classList.remove('hidden');

                let opts = typeof q.options === 'string' ? JSON.parse(q.options) : q.options;
                opts.forEach((opt) => {
                    const key = opt.trim().replace(/[\(\)]/g, '').charAt(0);
                    const label = document.getElementById(`label_${q.question_num}_${key}`);
                    if (label) {
                        label.classList.remove('bg-blue-50', 'border-blue-500', 'bg-green-100', 'border-green-500', 'bg-red-100', 'border-red-500');
                        
                        if (key === q.correct_option) {
                            label.classList.add('bg-green-100', 'border-green-500', 'text-green-800');
                        }
                    }
                });

                if (selected) {
                    const userAns = selected.value;
                    if (userAns === q.correct_option) {
                        correctCount++;
                    } else {
                        const wrongLabel = document.getElementById(`label_${q.question_num}_${userAns}`);
                        if (wrongLabel) {
                            wrongLabel.classList.add('bg-red-100', 'border-red-500', 'text-red-800');
                        }
                    }
                }
            });

            alert(`Bạn đã hoàn thành bài thi!\nSố câu đúng: ${correctCount}/${total}`);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 8. Quay lại trang danh sách bài thi
        function showExamList() {
            document.getElementById('viewExamList').classList.remove('hidden');
            document.getElementById('viewExamDetail').classList.add('hidden');
            document.getElementById('btnBack').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
