<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaiLieuHub - Luyện Thi Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col font-sans">

    <!-- Header / Navbar -->
    <header class="bg-white shadow-sm border-b px-6 py-4 sticky top-0 z-40">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="showHome()">
                <span class="text-2xl font-black text-blue-600 tracking-tight">TaiLieuHub</span>
                <span class="text-gray-300">|</span>
                <span class="text-gray-600 text-sm font-medium">Luyện Thi TOEIC</span>
            </div>
            <div>
                <button onclick="showHome()" class="text-sm font-semibold text-gray-600 hover:text-blue-600">
                    <i class="fa-solid fa-house mr-1"></i> Trang chủ
                </button>
            </div>
        </div>
    </header>

    <!-- TRANG CHỦ: Danh sách đề thi -->
    <main id="homeView" class="max-w-5xl mx-auto w-full px-4 py-10 flex-grow">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-extrabold text-gray-900 mb-2">Danh Sách Đề Thi TOEIC Listening</h1>
            <p class="text-gray-500 text-sm">Chọn đề thi để bắt đầu làm bài trực tuyến</p>
        </div>

        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Thẻ bài thi Test 01 -->
            <div onclick="openExam('TOEIC_NGHE_DOC', 'PART1_TEST_01')" class="bg-white rounded-2xl p-6 shadow-sm hover:shadow-md border border-gray-200 cursor-pointer transition-all hover:border-blue-500">
                <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center text-xl mb-4">
                    <i class="fa-solid fa-headphones"></i>
                </div>
                <h3 class="text-lg font-bold text-gray-800 mb-1">TOEIC Part 1 - Đề 01</h3>
                <p class="text-gray-500 text-xs mb-4">Mô tả hình ảnh (10 câu hỏi Listening)</p>
                <span class="text-blue-600 font-bold text-xs">Vào làm bài &rarr;</span>
            </div>
        </div>
    </main>

    <!-- TRANG LÀM BÀI THI -->
    <main id="examView" class="max-w-3xl mx-auto w-full px-4 py-8 flex-grow hidden">
        <button onclick="showHome()" class="mb-4 text-sm font-semibold text-gray-600 hover:text-blue-600 flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Quay lại danh mục
        </button>

        <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-200 mb-6 text-center">
            <h1 id="examTitle" class="text-2xl font-bold text-gray-800">Bài Thi Online</h1>
            <div id="scoreBox" class="mt-3 text-lg font-bold text-blue-600 hidden"></div>
        </div>

        <div id="questionsContainer" class="space-y-6"></div>

        <div class="mt-8 text-center">
            <button id="submitBtn" onclick="submitExam()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-8 py-3.5 rounded-xl shadow-lg transition-all">
                <i class="fa-solid fa-paper-plane mr-2"></i> Nộp Bài & Xem Đáp Án
            </button>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://wsbbdegvrcoffpkswhtq.supabase.co";
        const SUPABASE_KEY = "sb_publishable_d5rvYcP0DRHcEK-VHKCItQ_CVaM7TnC";
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentQuestionsData = [];

        function showHome() {
            document.getElementById('homeView').classList.remove('hidden');
            document.getElementById('examView').classList.add('hidden');
        }

        async function openExam(courseCode, examId) {
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('examView').classList.remove('hidden');
            document.getElementById('examTitle').innerText = `Bài Thi: ${examId}`;
            document.getElementById('questionsContainer').innerHTML = `<p class="text-center text-gray-500 py-10">Đang tải câu hỏi từ Supabase...</p>`;

            const { data: questions, error } = await _supabase
                .from('exam_questions')
                .select('*')
                .eq('course_code', courseCode)
                .eq('exam_id', examId)
                .order('question_num', { ascending: true });

            if (error || !questions || questions.length === 0) {
                document.getElementById('questionsContainer').innerHTML = `<p class="text-center text-gray-500 py-10">Chưa tìm thấy dữ liệu bài thi này!</p>`;
                document.getElementById('submitBtn').classList.add('hidden');
                return;
            }

            document.getElementById('submitBtn').classList.remove('hidden');
            currentQuestionsData = questions;
            renderQuestions(questions);
        }

        function renderQuestions(questions) {
            let html = '';
            questions.forEach((q) => {
                let opts = typeof q.options === 'string' ? JSON.parse(q.options) : q.options;
                html += `
                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-200">
                        <div class="font-bold text-gray-800 mb-3">Câu ${q.question_num}: Nghe và chọn đáp án đúng</div>
                        
                        ${q.audio_url ? `<audio controls class="w-full mb-4 rounded-lg border"><source src="${q.audio_url}"></audio>` : ''}
                        ${q.image_url ? `<img src="${q.image_url}" class="max-w-full rounded-xl mb-4 border mx-auto">` : ''}

                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
                            ${opts.map((opt) => {
                                const key = opt.trim().charAt(0) === '(' ? opt.trim().charAt(1) : opt.trim().charAt(0);
                                return `
                                    <label id="label_${q.question_num}_${key}" class="flex items-center justify-center p-3 border rounded-xl cursor-pointer hover:bg-blue-50 border-gray-200 font-medium text-gray-700">
                                        <input type="radio" name="q_${q.question_num}" value="${key}" class="mr-2 text-blue-600">
                                        <span>${opt}</span>
                                    </label>
                                `;
                            }).join('')}
                        </div>

                        <div id="exp_${q.question_num}" class="mt-4 p-4 rounded-xl hidden text-sm">
                            <p class="font-bold mb-2">Đáp án & Giải thích:</p>
                            ${q.explanation ? `<img src="${q.explanation}" class="max-w-full rounded-lg border">` : ''}
                        </div>
                    </div>
                `;
            });
            document.getElementById('questionsContainer').innerHTML = html;
        }

        function submitExam() {
            let correctCount = 0;
            currentQuestionsData.forEach((q) => {
                const selected = document.querySelector(`input[name="q_${q.question_num}"]:checked`);
                const userChoice = selected ? selected.value : null;
                const correct = q.correct_option ? q.correct_option.trim().toUpperCase() : 'A';
                const expDiv = document.getElementById(`exp_${q.question_num}`);

                expDiv.classList.remove('hidden');
                if (userChoice === correct) {
                    correctCount++;
                    expDiv.className = "mt-4 p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800";
                } else {
                    expDiv.className = "mt-4 p-4 rounded-xl bg-red-50 border border-red-200 text-red-800";
                }
            });

            document.getElementById('scoreBox').innerText = `Kết quả của bạn: ${correctCount} / ${currentQuestionsData.length} câu đúng!`;
            document.getElementById('scoreBox').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
